paths:
  dataset_root: "./data"
  output_root: "./outputs"

training:
  seed: 43
  batch_size: 2           # memory constraint: batch_size <= 2
  epochs: 300
  lr: 1.0e-4
  device: "cuda"
  early_stopping_patience: 20

data:
  temporal_length: 1
  num_workers: 0          # Windows: multiprocessing with DataLoader requires 0

model:
  in_channels: 21         # channels 0-19 + 21 (dNDVI); channel 20 (dNBR) excluded

rrr:
  lambda_rrr: 0.0         # 0.0 = baseline; > 0.0 = RRR regularization active
  rrr_distance_metric: "mse"   # "mse" or "cosine"

checkpointing:
  checkpoint_dir: "./outputs/checkpoints"

mlflow:
  mlflow_experiment: "burned_area"
  mlflow_tracking_uri: "./outputs/mlruns"
